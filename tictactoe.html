<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic-Tac-Toe</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #1e1e2e;
    color: #e0e0e0;
  }
  h1 {
    margin-bottom: 0.25rem;
  }
  #status {
    margin: 1rem 0;
    font-size: 1.25rem;
    min-height: 1.5rem;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
    background: #444;
    padding: 6px;
    border-radius: 8px;
  }
  .cell {
    background: #2b2b3d;
    border: none;
    border-radius: 4px;
    font-size: 3rem;
    font-weight: bold;
    color: #e0e0e0;
    cursor: pointer;
    transition: background 0.15s;
  }
  .cell:hover:not(:disabled) {
    background: #3a3a52;
  }
  .cell.x { color: #79c0ff; }
  .cell.o { color: #ff7b72; }
  .cell.win { background: #2d5a2d; }
  #reset {
    margin-top: 1.5rem;
    padding: 0.6rem 1.5rem;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    background: #4a9eff;
    color: white;
    cursor: pointer;
  }
  #reset:hover { background: #357acc; }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status">X's turn</div>
  <div id="board"></div>
  <button id="reset">New Game</button>

<script>
  const board = document.getElementById('board');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('reset');

  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let cells = Array(9).fill('');
  let turn = 'X';
  let over = false;

  function render() {
    board.innerHTML = '';
    cells.forEach((val, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (val ? ' ' + val.toLowerCase() : '');
      btn.textContent = val;
      btn.disabled = !!val || over;
      btn.addEventListener('click', () => play(i));
      board.appendChild(btn);
    });
  }

  function play(i) {
    if (over || cells[i]) return;
    cells[i] = turn;
    const winLine = checkWin(turn);
    if (winLine) {
      over = true;
      status.textContent = turn + ' wins!';
      render();
      winLine.forEach(idx => board.children[idx].classList.add('win'));
      return;
    }
    if (cells.every(c => c)) {
      over = true;
      status.textContent = "It's a draw!";
      render();
      return;
    }
    turn = turn === 'X' ? 'O' : 'X';
    status.textContent = turn + "'s turn";
    render();
  }

  function checkWin(player) {
    return WINS.find(line => line.every(i => cells[i] === player)) || null;
  }

  function reset() {
    cells = Array(9).fill('');
    turn = 'X';
    over = false;
    status.textContent = "X's turn";
    render();
  }

  resetBtn.addEventListener('click', reset);
  render();
</script>
</body>
</html>
